<style>
:root{
  --bg0:#0c0a0f;--bg1:#121016;--bg2:#18141d;--bg3:#201b26;--bg4:#29222f;
  --border:#2a2330;--border2:#3b3243;--text:#efe9f2;--text2:#b8afc1;--text3:#7f768a;
  --accent:#c4364f;--accent2:#d84b65;--accent-soft:#3a1b24;--gold:#d4ac62;--ok:#4cc38a;--warn:#e5a84a;--danger:#ec5b5b;--ai:#a48bff;
  --r:14px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg0);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg0) 75%,rgba(12,10,15,.85));padding:calc(10px + var(--safe-t)) 14px 8px;backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:30px;height:30px;border-radius:8px}
.brand h1{font:600 15px/1 Cinzel,serif;letter-spacing:.08em;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font:500 11px Inter;color:var(--text3);letter-spacing:0;margin-top:3px}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--bg2);display:grid;place-items:center;padding:0;flex:none}
.icon-btn svg{width:19px;height:19px;stroke:var(--text2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.on{background:var(--accent-soft);border-color:var(--accent)}
.icon-btn.on svg{stroke:var(--accent2)}
.searchrow{display:flex;gap:8px;margin-top:10px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:0 12px;height:42px}
.search svg{width:17px;height:17px;stroke:var(--text3);fill:none;stroke-width:2;flex:none}
.search input{flex:1;background:none;border:0;outline:0;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--border);background:var(--bg2);color:var(--text2);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.x::after{content:" ×";opacity:.8}
main{padding:6px 10px calc(84px + var(--safe-b))}
.status{color:var(--text3);font-size:12.5px;padding:2px 4px 8px;display:flex;justify-content:space-between;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:6px}
.card{position:relative;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--bg2);border:0;padding:0}
.card img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s}
.card img.ok{opacity:1}
.card .badge{position:absolute;top:5px;right:5px;font-size:11px;background:rgba(12,10,15,.72);border-radius:999px;padding:1px 6px;color:var(--gold)}
.card .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--text3);font-size:11px;padding:6px;text-align:center}
/* Never draw an image title over its pixels. Keep names in details and accessibility labels. */
.card .ph:has(+ img.ok){display:none}
.card.blur img{filter:blur(14px)}
.sentinel{height:40px}
.pending{margin:0 0 14px}
.pending .ph-head{display:flex;align-items:center;gap:8px;margin:2px 4px 8px;font-size:13px;color:var(--text2)}
.pending .ph-head b{color:var(--gold);font-weight:600}
.pending .row-scroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pending .row-scroll::-webkit-scrollbar{display:none}
.pending .card{flex:none;width:96px;border:1px dashed var(--gold)}
.pending .card .badge{color:var(--gold);left:5px;right:auto}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ent{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;text-align:left;padding:0}
.ent .cv{aspect-ratio:4/5;background:var(--bg2)}
.ent .cv img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s}
.ent .cv img.ok{opacity:1}
.ent b{display:block;padding:8px 10px 0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent span{display:block;padding:0 10px 9px;color:var(--text3);font-size:12px}
.section-title{display:flex;align-items:center;gap:10px;margin:6px 4px 12px}
.section-title h2{font:600 18px Cinzel,serif;margin:0;flex:1;letter-spacing:.04em}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(7,1fr);background:rgba(18,16,22,.96);border-top:1px solid var(--border);padding:6px 4px calc(6px + var(--safe-b));backdrop-filter:blur(10px)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--text3);padding:4px 0;min-width:0}
nav.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent2)}
nav.tabs .add{color:#fff}
nav.tabs .add span.ic{background:var(--accent);width:44px;height:30px;border-radius:12px;display:grid;place-items:center}
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg0);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:calc(8px + var(--safe-t)) 10px 8px;background:rgba(12,10,15,.9);backdrop-filter:blur(8px)}
.sheet .bar .t{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewer{position:relative;background:#000;height:62vh;overflow:auto;display:flex;align-items:center;justify-content:center;touch-action:pan-x pan-y pinch-zoom}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .2s}
.viewer.zoom{display:block}
.viewer.zoom img{max-width:none;max-height:none;width:250%}
.viewer .spin{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--text2);background:rgba(0,0,0,.5);padding:3px 10px;border-radius:999px}
.info{padding:14px 14px calc(30px + var(--safe-b))}
.info h3{font-size:18px;margin:0 0 4px;display:flex;gap:8px;align-items:flex-start}
.info h3 span{flex:1}
.meta{color:var(--text3);font-size:12.5px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.stars button{background:none;border:0;padding:2px;font-size:24px;line-height:1;color:var(--border2)}
.stars button.on{color:var(--gold)}
.fav{font-size:22px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;height:40px;min-width:44px}
.fav.on{background:var(--accent-soft);border-color:var(--accent)}
.lbl{font-size:11px;letter-spacing:.08em;color:var(--text3);text-transform:uppercase;margin:16px 0 6px}
.tagwrap{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1px solid var(--border);background:var(--bg2);border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--text2)}
.tag.p{border-color:var(--accent);color:var(--text)}
.tag.t{border-color:#2f5a49;color:#bfe9d6}
.desc{color:var(--text2);font-size:14px;white-space:pre-wrap}
textarea,input.txt,select{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;outline:0}
textarea{min-height:76px;resize:vertical}
.btn{border:1px solid var(--border2);background:var(--bg3);border-radius:12px;padding:10px 14px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
a.btn{color:var(--text);text-decoration:none}
label.btn{cursor:pointer}
.btn.wide{width:100%;justify-content:center}
.btn:disabled{opacity:.5}
.panel{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px}
.panel h4{margin:0 0 6px;font-size:15px}
.muted{color:var(--text3);font-size:13px}
.up{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.up img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--bg2)}
.up .n{flex:1;min-width:0}
.up .n b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up progress{width:100%;height:5px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(86px + var(--safe-b));transform:translateX(-50%);z-index:80;background:var(--bg4);border:1px solid var(--border2);padding:10px 16px;border-radius:12px;font-size:13.5px;max-width:92vw;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;margin:0 0 10px;display:flex;gap:10px;align-items:center;font-size:13.5px}
.banner span{flex:1}
.filters label{display:block;margin:12px 0 4px;font-size:12px;color:var(--text3);letter-spacing:.06em;text-transform:uppercase}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.empty{color:var(--text3);text-align:center;padding:50px 20px}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:520px;margin:0 auto}
.login img{width:84px;height:84px;border-radius:20px;margin:0 auto 16px;display:block}
.login h1{font:600 24px Cinzel,serif;text-align:center;letter-spacing:.1em;margin:0 0 6px}
.login p{color:var(--text2);text-align:center;margin:0 0 22px}
.login label{display:block;font-size:12px;color:var(--text3);margin:12px 0 4px;letter-spacing:.06em;text-transform:uppercase}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.viewer{height:70vh}}

/* Ultimate statistics: responsive and touch-friendly, no external chart engine. */
.viz-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-bottom:14px}
.viz-kpi{background:var(--bg2);border:1px solid var(--border);border-radius:13px;padding:14px}
.viz-kpi strong{display:block;font-size:24px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.viz-kpi span{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.viz-sub{color:var(--text3);font-size:12px;margin:4px 0 12px}
.viz-grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.viz-bar{display:grid;grid-template-columns:minmax(66px,105px) minmax(0,1fr) 40px;gap:7px;align-items:center;width:100%;padding:10px 1px;border:0;border-bottom:1px solid var(--border);background:transparent;text-align:left;font-size:12px;color:var(--text2)}
.viz-bar:active{opacity:.7}
.viz-bar .viz-track{height:11px;border-radius:9px;overflow:hidden;background:var(--bg4)}
.viz-bar .viz-fill{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--accent),var(--gold))}
.viz-bar b{text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
.viz-donut{width:155px;height:155px;margin:8px auto;border-radius:50%;display:grid;place-items:center}
.viz-donut .center{width:113px;height:113px;border-radius:50%;background:var(--bg1);display:flex;align-items:center;justify-content:center;flex-direction:column}
.viz-donut strong{font-size:28px}
.viz-legend{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.viz-legend span{font-size:11px;color:var(--text2)}
.viz-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.viz-matrix{display:grid;gap:4px;overflow-x:auto;font-size:11px}
.viz-matrix button{min-height:32px;border:1px solid var(--border);border-radius:7px;font-weight:600;min-width:0}
.viz-matrix .viz-head{text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2);font-size:10px;align-self:center}
.viz-matrix .viz-row-head{text-align:right;padding-right:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viz-timeline{width:100%;height:auto;display:block;min-height:124px;max-height:220px}
@media(min-width:780px){.viz-kpis{grid-template-columns:repeat(4,1fr)}.viz-grid{grid-template-columns:minmax(0,1.4fr) minmax(240px,1fr)}}
</style>

<script>
"use strict";
/* ============================================================= costanti e stato */
const SCOPE = "https://www.googleapis.com/auth/drive";
const API = "https://www.googleapis.com/drive/v3";
const UPLOAD = "https://www.googleapis.com/upload/drive/v3";
const DEFAULT_ROOT = "";
const INDEX_NAME = "indice_web.json.gz";
const PAGE = 120;
const GROUPS = {donna: "Women", uomo: "Men", altro: "Creatures and others"};

const S = {
  token: null, tokenExp: 0, tokenClient: null, pendingLogin: null,
  folders: null, index: null, byId: new Map(), entById: new Map(), thingById: new Map(), hay: new Map(),
  ops: load("cv_ops", []), query: "", filters: load("cv_filters", {}), view: "gallery", list: [], shown: 0,
  statsFilters: load("cv_v7_stats_filters", {hair_color:"black",eye_color:"green",logic:"AND"}),
  packs: new Map(), packOrder: [], packWait: new Map(), detailList: [], blurExplicit: load("cv_blur", false),
  pending: [], localUploads: new Map(),
};
function load(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
const $ = (sel, root=document) => root.querySelector(sel);
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function displayLabel(value){ return S.index?.labels?.[value] || value; }
function norm(s){ return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
function folderId(text){ const m = String(text||"").match(/\/folders\/([A-Za-z0-9_-]{10,})/) || String(text||"").match(/[?&]id=([A-Za-z0-9_-]{10,})/); return m ? m[1] : (/^[A-Za-z0-9_-]{10,}$/.test(String(text||"").trim()) ? String(text).trim() : ""); }
function toast(text, ms=3200){ const t = document.createElement("div"); t.className = "toast"; t.textContent = text; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
const ICONS = {
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.2.6 3.5 2.6 3.5 6"/>',
  layers:'<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', cog:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>', filter:'<path d="M3 5h18l-7 8v6l-4 2v-8z"/>',
  back:'<path d="M15 5l-7 7 7 7"/>', refresh:'<path d="M20 11a8 8 0 0 0-14.6-4.5L3 9"/><path d="M3 4v5h5"/><path d="M4 13a8 8 0 0 0 14.6 4.5L21 15"/><path d="M21 20v-5h-5"/>',
  download:'<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>', edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  ext:'<path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>', camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 16-5-5-9 9"/>',
};
const ico = n => `<svg viewBox="0 0 24 24">${ICONS[n]}</svg>`;
// Logo inside the page (7.2): never a broken image, animated on the welcome/loading screens.
let logoSeq = 0;
function logoSvg(size, cls=""){

      <radialGradient id="${gl}" cx=".5" cy=".58" r=".35"><stop offset="0" style="stop-color:var(--accent)" stop-opacity=".5"/><stop offset="1" style="stop-color:var(--accent)" stop-opacity="0"/></radialGradient></defs>

      <circle cx="256" cy="292" r="17" fill="url(#${g})"/><path d="M248 298 L242 326 H270 L264 298 Z" fill="url(#${g})"/></g>

}

/* ============================================================= accesso Google */
// Dentro l'app Android (CVNative): accesso con l'account del telefono, senza ID client da incollare.
const NATIVE = !!window.CVNative;
function clientId(){ return NATIVE ? "android" : (localStorage.getItem("cv_client_id") || ""); }
function rootId(){ return folderId(localStorage.getItem("cv_root") || DEFAULT_ROOT); }
function restoreToken(){
  try { const t = JSON.parse(sessionStorage.getItem("cv_token") || "null"); if (t && t.exp > Date.now()) { S.token = t.v; S.tokenExp = t.exp; } } catch(e){}
}
function initAuth(){
  if (S.tokenClient || !window.google?.accounts?.oauth2 || !clientId()) return !!S.tokenClient;
  S.tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: clientId(), scope: SCOPE,
    callback: r => {
      const p = S.pendingLogin; S.pendingLogin = null;
      if (r.error) { p?.rej(new Error(r.error_description || r.error)); return; }
      S.token = r.access_token; S.tokenExp = Date.now() + (Number(r.expires_in || 3600) - 90) * 1000;
      try { sessionStorage.setItem("cv_token", JSON.stringify({v: S.token, exp: S.tokenExp})); } catch(e){}
      localStorage.setItem("cv_logged", "1");
      p?.res();
    },
    error_callback: e => { const p = S.pendingLogin; S.pendingLogin = null; p?.rej(new Error(e?.message || e?.type || "sign-in canceled")); },
  });
  return true;
}
function setToken(value, seconds){
  S.token = value; S.tokenExp = Date.now() + Math.max(60, Number(seconds || 3000) - 90) * 1000;
  try { sessionStorage.setItem("cv_token", JSON.stringify({v: S.token, exp: S.tokenExp})); } catch(e){}
  localStorage.setItem("cv_logged", "1");
}
let nativeWait = null;
window.__cvNativeToken = (token, seconds, error) => {
  const p = nativeWait; nativeWait = null;
  if (token) { setToken(token, seconds); p?.res(); } else p?.rej(new Error(error === "consent_required" ? "Google sign-in is required" : (error || "sign-in failed")));
};
function nativeLogin(interactive){
  if (nativeWait) return nativeWait.promise;
  let res, rej; const promise = new Promise((a, b) => { res = a; rej = b; });
  nativeWait = {res, rej, promise};
  window.CVNative.requestToken(!!interactive);
  return promise;
}
function login(prompt=""){
  if (NATIVE) return nativeLogin(prompt !== "");
  return new Promise((res, rej) => {
    if (!initAuth()) { rej(new Error("Google sign-in service has not loaded")); return; }
    S.pendingLogin = {res, rej};
    S.tokenClient.requestAccessToken({prompt});
  });
}
class AuthNeeded extends Error {}
async function api(url, opts={}, raw=false, retried=false){
  if (!S.token || Date.now() > S.tokenExp) {
    // Nell'app il token si rinnova da solo, in silenzio; nel browser serve un tocco su «Reconnect».
    if (NATIVE) { try { await nativeLogin(false); } catch(e) { showReconnect(); throw new AuthNeeded("session expired"); } }
    else { showReconnect(); throw new AuthNeeded("session expired"); }
  }
  const headers = Object.assign({Authorization: "Bearer " + S.token}, opts.headers || {});
  const r = await fetch(url, Object.assign({}, opts, {headers}));
  if (r.status === 401) {
    if (NATIVE && !retried) { window.CVNative.invalidateToken(S.token); S.token = null; return api(url, opts, raw, true); }
    S.token = null; showReconnect(); throw new AuthNeeded("session expired");
  }
  if (!r.ok && !raw) { let m = r.status + ""; try { m = (await r.json()).error.message || m; } catch(e){} throw new Error("Drive: " + m); }
  return r;
}
async function apiJson(url, opts){ return (await api(url, opts)).json(); }
function showReconnect(){
  if ($("#reconnect")) return;
  const b = document.createElement("div");
  b.id = "reconnect"; b.className = "banner"; b.style.cssText = "position:fixed;top:calc(8px + var(--safe-t));left:10px;right:10px;z-index:90";
  b.innerHTML = `<span>Google session expired.</span><button class="btn primary">Reconnect</button>`;
  b.querySelector("button").onclick = async () => { try { await login(NATIVE ? "consent" : ""); b.remove(); toast("Reconnected"); render(); } catch(e){ toast(e.message); } };
  document.body.appendChild(b);
}

/* ============================================================= Drive */
async function children(parent, name, folders, fresh=false){
  let q = `'${parent}' in parents and trashed=false`;
  if (name) q += ` and name='${name.replace(/'/g, "\\'")}'`;
  if (folders === true) q += " and mimeType='application/vnd.google-apps.folder'";
  const p = new URLSearchParams({q, fields: "files(id,name,modifiedTime,size,version)", pageSize: "100", supportsAllDrives: "true", includeItemsFromAllDrives: "true"});
  return (await apiJson(`${API}/files?${p}`, fresh ? {cache: "no-store"} : undefined)).files || [];
}
async function media(id){ return (await api(`${API}/files/${id}?alt=media&supportsAllDrives=true`)).arrayBuffer(); }
async function resolveFolders(){
  if (S.folders) return S.folders;
  const root = rootId();
  const web = (await children(root, "web", true))[0];
  if (!web) throw new Error("The archive has no web index yet. Open Character Vault on the desktop and wait for its first publication.");
  const mod = (await children(web.id, "modifiche", true))[0];
  S.folders = {root, web: web.id, modifiche: mod ? mod.id : ""};
  return S.folders;
}
async function gunzipJson(buf){
  const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}

/* ============================================================= indice */
async function loadIndex(force=false){
  const f = await resolveFolders();
  const file = (await children(f.web, INDEX_NAME, false, NATIVE))[0];
  if (!file) throw new Error("The desktop has not published an index yet.");
  const cache = await caches.open("cv-data");
  const key = "https://cv.local/index";
  const hit = await cache.match(key);
  // On Android, a Drive index can be overwritten under the same file ID.
  // Compare Drive's file version as well as its modification timestamp to
  // prevent a stale WebView cache from hiding newly published photographs.
  const revision = [file.id, file.version || "", file.modifiedTime || "", file.size || ""].join(":");
  const same = NATIVE ? hit?.headers.get("x-drive-revision") === revision
                      : hit?.headers.get("x-mod") === file.modifiedTime;
  if (!force && hit && same) {
    setIndex(await hit.json());
    return false;
  }
  const data = await gunzipJson(await media(file.id));
  await cache.put(key, new Response(JSON.stringify(data), {headers: {"x-mod": file.modifiedTime, "x-drive-revision": revision, "content-type": "application/json"}}));
  setIndex(data);
  return true;
}
async function loadCachedIndex(){
  try { const hit = await (await caches.open("cv-data")).match("https://cv.local/index"); if (hit) { setIndex(await hit.json()); return true; } } catch(e){}
  return false;
}
function setIndex(data){
  S.index = data;
  if (NATIVE) { try { window.CVNative.setContext(data.inbox || ""); } catch(e){} }
  S.byId = new Map(data.images.map(x => [x.i, x]));
  S.subjectById = new Map((data.subjects||[]).map(x=>[x.id,x]));
  S.entById = new Map(data.entities.map(x => [x.id, x]));
  S.thingById = new Map(data.things.map(x => [x.id, x]));
  // modifiche già applicate dal PC (indice generato dopo l'invio) non servono più
  S.ops = S.ops.filter(o => !(o.sent && data.generated_ts > o.sentAt + 180));
  save("cv_ops", S.ops);
  applyOverlay();
  S.hay = new Map();
}
function applyOverlay(){
  for (const o of S.ops) {
    if (o.image && S.byId.has(o.image)) {
      const it = S.byId.get(o.image);
      if (o.op === "favorite") it.fav = o.value ? 1 : 0;
      if (o.op === "rating") it.r = o.value;
      if (o.op === "notes") it.n = o.value;
      if (o.op === "title") it.t = o.value;
    }
    if (o.op === "entity_name" && S.entById.has(o.entity)) S.entById.get(o.entity).name = o.value || S.entById.get(o.entity).name;
    if (o.op === "thing_name" && S.thingById.has(o.thing)) S.thingById.get(o.thing).name = o.value || S.thingById.get(o.thing).name;
  }
}
function haystack(it){
  let h = S.hay.get(it.i);
  if (h === undefined) {
    const names = (it.e || []).map(id => S.entById.get(id)?.name || "").join(" ") + " " + (it.th || []).map(id => S.thingById.get(id)?.name || "").join(" ");
    h = norm([it.t, it.f, it.c, it.sc, it.s, it.st, it.cr, (it.tg || []).join(" "), it.d, it.n, names, it.i].join(" "));
    S.hay.set(it.i, h);
  }
  return h;
}

/* ============================================================= foto awaiting desktop processing */
// Le foto caricate (da questo o da un altro telefono) restano nella cartella di origine finché un PC non le
// importa: si mostrano subito, poi diventano records complete quando il PC ripubblica l'indice.
async function loadPending(){
  const inbox = S.index?.inbox;
  if (!inbox) { S.pending = []; return; }
  const p = new URLSearchParams({q: `'${inbox}' in parents and trashed=false and (mimeType contains 'image/' or mimeType contains 'video/')`,
    fields: "files(id,name,mimeType,createdTime,thumbnailLink,size)", orderBy: "createdTime desc", pageSize: "200",
    supportsAllDrives: "true", includeItemsFromAllDrives: "true"});
  try {
    // Already imported by the desktop (complete record in the gallery): do not list them twice.
    const done = new Set(S.index?.inbox_done || []);
    S.pending = ((await apiJson(`${API}/files?${p}`)).files || []).filter(f => !done.has(f.id));
  }
  catch(e) { if (!(e instanceof AuthNeeded)) S.pending = S.pending || []; }
}
async function pendingSrc(f){
  if (S.localUploads.has(f.id)) return S.localUploads.get(f.id);
  if (f.thumbnailLink) return f.thumbnailLink.replace(/=s\d+$/, "=s400");
  const u = URL.createObjectURL(new Blob([await media(f.id)])); S.localUploads.set(f.id, u); return u;
}
function pendingHtml(){
  if (!S.pending.length || S.query || activeFilterChips().length) return "";
  return `<section class="pending"><div class="ph-head">⏳ <b>${S.pending.length} awaiting desktop processing</b><span class="muted">· complete records appear after desktop processing</span></div>
    <div class="row-scroll">${S.pending.map(f => `<button class="card" data-pending="${esc(f.id)}">${(f.mimeType || "").startsWith("video/") ? '<div class="ph">▶ Video</div>' : `<img alt="" data-pid="${esc(f.id)}">`}<span class="badge">⏳</span></button>`).join("")}</div></section>`;
}
function bindPending(){
  document.querySelectorAll("img[data-pid]").forEach(img => {
    const f = S.pending.find(x => x.id === img.dataset.pid); if (!f) return;
    pendingSrc(f).then(u => { img.src = u; img.onload = () => img.classList.add("ok");
      img.onerror = async () => { if (img.dataset.retry) return; img.dataset.retry = "1"; f.thumbnailLink = ""; try { img.src = await pendingSrc(f); } catch(e){} }; }).catch(() => {});
  });
  document.querySelectorAll("[data-pending]").forEach(b => b.onclick = () => openPending(b.dataset.pending));
}
function openPending(id){
  const f = S.pending.find(x => x.id === id); if (!f) return;
  const d = document.createElement("div"); d.className = "sheet"; d.id = "detail";
  d.innerHTML = `<div class="bar"><button class="icon-btn" id="pback">${ico("back")}</button><div class="t">${esc(f.name)}</div></div>
    <div class="viewer"><img id="pimg" alt=""><div class="spin" id="pspin">loading…</div></div>
    <div class="info"><h3><span>${esc(f.name)}</span></h3>
      <div class="meta">Uploaded on ${new Date(f.createdTime).toLocaleString("en-US")}${f.size ? ` · ${f.size >= 1e6 ? (f.size / 1e6).toFixed(1) + " MB" : Math.max(1, Math.round(f.size / 1e3)) + " KB"}` : ""}</div>
      <div class="banner"><span>⏳ Awaiting desktop processing: when Character Vault opens on a desktop, the asset is imported, recognized and described by Codex, then appears here as a complete record.</span></div></div>`;
  document.body.appendChild(d); document.body.style.overflow = "hidden";
  history.pushState({detail: id}, "");
  $("#pback").onclick = () => history.back();
  if ((f.mimeType || "").startsWith("video/")) {
    if (S.localUploads.has(f.id)) {
      $("#pimg").outerHTML = '<video id="pvideo" controls playsinline style="max-width:100%;max-height:70vh"></video>';
      $("#pvideo").src = S.localUploads.get(f.id);
      $("#pspin")?.remove();
    } else {
      $("#pspin").remove();
      const viewer = d.querySelector(".viewer");
      viewer.insertAdjacentHTML("beforeend", playOverlay());
      $("#vplay").onclick = () => playVideo(f.id, f.name, viewer);
    }
    return;
  }
  const show = u => { $("#pimg").src = u; $("#pspin")?.remove(); };
  if (S.localUploads.has(f.id)) show(S.localUploads.get(f.id));
  else media(f.id).then(buf => { const u = URL.createObjectURL(new Blob([buf])); S.localUploads.set(f.id, u); show(u); })
    .catch(() => { const s = $("#pspin"); if (s) s.textContent = "preview unavailable"; });
}

// Foto inviate dal ritaglio nativo o da «Condividi»: compaiono subito tra quelle in attesa.
window.__cvNativeUploaded = async n => {
  toast(`${n} ${n === 1 ? "photo added" : "photos added"}: awaiting desktop processing`);
  await loadPending(); if (location.hash.startsWith("#/add")) go("#/"); else render();
};

/* ============================================================= riproduzione video */
// App Android: player nativo che trasmette da Drive (salto avanti/indietro, nessun download completo).
// Browser: il video viene scaricato e poi riprodotto nella pagina (i video lunghi richiedono tempo e dati).
async function playVideo(fileId, title, container){
  if (NATIVE && window.CVNative.playVideo) { window.CVNative.playVideo(fileId, title || "Video"); return; }
  container.innerHTML = `<div class="spin" id="vprog">downloading video…</div>`;
  try {
    const r = await api(`${API}/files/${fileId}?alt=media&supportsAllDrives=true`);
    const total = Number(r.headers.get("content-length") || 0);
    const reader = r.body.getReader(); const parts = []; let got = 0;
    for (;;) {
      const {done, value} = await reader.read(); if (done) break;
      parts.push(value); got += value.length;
      const p = $("#vprog"); if (p) p.textContent = total ? `download ${Math.round(got / total * 100)}% · ${(got / 1e6).toFixed(1)} MB` : `download ${(got / 1e6).toFixed(1)} MB`;
    }
    const url = URL.createObjectURL(new Blob(parts, {type: r.headers.get("content-type") || "video/mp4"}));
    detailUrls.push(url);
    container.innerHTML = `<video controls autoplay playsinline style="max-width:100%;max-height:100%"></video>`;
    const v = container.querySelector("video"); v.src = url;
    v.onerror = () => { container.innerHTML = `<div class="spin">the browser cannot play this format. Use Download original, or Convert to MP4 on the desktop</div>`; };
  } catch(e) { container.innerHTML = `<div class="spin">${esc(e.message)}</div>`; }
}
function playOverlay(){
  return `<button class="btn primary" id="vplay" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:17px;padding:14px 22px;box-shadow:0 6px 24px rgba(0,0,0,.6)">▶ Play</button>`;
}

/* ============================================================= modifiche dal telefono */
async function queueOp(op){
  op.at = Date.now() / 1000; op.sent = false;
  S.ops.push(op); save("cv_ops", S.ops); applyOverlay(); S.hay.delete(op.image);
  await flushOps();
}
async function flushOps(){
  const todo = S.ops.filter(o => !o.sent);
  if (!todo.length) return;
  try {
    const f = await resolveFolders();
    if (!f.modifiche) throw new Error("The archive changes folder is missing");
    const body = JSON.stringify(todo.map(({sent, sentAt, ...o}) => o));
    const name = `${Math.floor(Date.now()/1000)}_${Math.random().toString(36).slice(2,8)}.json`;
    await uploadSmall(new Blob([body], {type: "application/json"}), name, f.modifiche);
    const now = Date.now() / 1000;
    todo.forEach(o => { o.sent = true; o.sentAt = now; });
    save("cv_ops", S.ops);
  } catch(e) {
    if (!(e instanceof AuthNeeded)) toast("Edit saved on this device; it will be sent when the connection is available");
  }
}
async function uploadSmall(blob, name, parent){
  const boundary = "cv" + Math.random().toString(36).slice(2);
  const meta = JSON.stringify({name, parents: [parent]});
  const body = new Blob([`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${boundary}\r\nContent-Type: ${blob.type || "application/octet-stream"}\r\n\r\n`, blob, `\r\n--${boundary}--`]);
  return apiJson(`${UPLOAD}/files?uploadType=multipart&supportsAllDrives=true&fields=id`, {method: "POST", headers: {"Content-Type": `multipart/related; boundary=${boundary}`}, body});
}
function uploadLarge(file, parent, onProgress){
  return new Promise(async (resolve, reject) => {
    try {
      const init = await api(`${UPLOAD}/files?uploadType=resumable&supportsAllDrives=true&fields=id`, {
        method: "POST", headers: {"Content-Type": "application/json; charset=UTF-8", "X-Upload-Content-Type": file.type || "application/octet-stream", "X-Upload-Content-Length": String(file.size)},
        body: JSON.stringify({name: file.name || `photo_${Date.now()}.jpg`, parents: [parent]})});
      const location = init.headers.get("Location");
      if (!location) { // intestazione non esposta: caricamento in un'unica richiesta
        resolve(await uploadSmall(file, file.name || `photo_${Date.now()}.jpg`, parent)); onProgress(1); return;
      }
      const xhr = new XMLHttpRequest();
      xhr.open("PUT", location);
      xhr.upload.onprogress = e => e.lengthComputable && onProgress(e.loaded / e.total);
      xhr.onload = () => xhr.status < 300 ? resolve(JSON.parse(xhr.responseText || "{}")) : reject(new Error("upload: HTTP " + xhr.status));
      xhr.onerror = () => reject(new Error("network unavailable"));
      xhr.send(file);
    } catch(e) { reject(e); }
  });
}

/* ============================================================= visualizzazione dettaglio */
function loadDetailImage(it, img, spin){
  // Cropped cards (k) and original/preview media (p/o) are uploaded independently.
  // An already published crop is usable even when the full-resolution file has
  // not reached Drive. Original media still takes priority once available.
  const big = it.p || (it.mt === "video" ? "" : it.o);
  let cropped = "";
  const status = message => { if (spin?.isConnected) spin.textContent = message; };
  const show = (url, full=false) => {
    if (!img.isConnected || !url || (!full && img.dataset.big)) return;
    if (full) img.dataset.big = "1";
    img.onload = () => { if (img.isConnected && spin?.isConnected) spin.remove(); };
    img.onerror = () => {
      if (full) {
        // A bad remote preview must not hide a valid cropped thumbnail.
        delete img.dataset.big;
        if (cropped) { show(cropped); return; }
      }
      status(big ? "Remote image unavailable — try Refresh" : "Waiting for desktop to publish preview to Drive");
    };
    img.src = url;
  };
  thumbUrl(it).then(url => {
    if (!url) { if (!big) status("Waiting for desktop to publish preview to Drive"); return; }
    if (!img.isConnected) {
      if (url.startsWith("blob:")) URL.revokeObjectURL(url);
      return;
    }
    detailUrls.push(url);
    cropped = url;
    if (!img.dataset.big) show(url);
  }).catch(() => { if (!big) status("Preview download failed — try Refresh"); });
  if (big) {
    media(big).then(buf => {
      const url = URL.createObjectURL(new Blob([buf]));
      if (!img.isConnected) { URL.revokeObjectURL(url); return; }
      detailUrls.push(url);
      show(url, true);
    }).catch(err => {
      // If the original is temporarily unavailable, keep the usable crop.
      if (!cropped && !img.getAttribute("src"))
        status(err instanceof AuthNeeded ? "session expired" : "preview unavailable");
    });
  }
}

/* ============================================================= miniature a pacchetti */
async function pack(no){
  // Chiave = ID del file su Drive (non il numero): quando il PC rifà le miniature i numeri ripartono,
  // ma i file sono nuovi; con il numero il telefono mostrava le miniature vecchie fino al riavvio.
  const id = S.index.packs[String(no)];
  if (!id) throw new Error("bundle not listed in the index");
  if (S.packs.has(id)) return S.packs.get(id);
  if (S.packWait.has(id)) return S.packWait.get(id);
  const p = (async () => {
    const cache = await caches.open("cv-packs");
    const key = `https://cv.local/pack/${id}`;
    let hit = await cache.match(key), buf;
    if (hit) buf = await hit.arrayBuffer();
    else { buf = await media(id); await cache.put(key, new Response(buf)); }
    S.packs.set(id, buf); S.packOrder.push(id);
    while (S.packOrder.length > 24) S.packs.delete(S.packOrder.shift());   // memoria contenuta
    S.packWait.delete(id);
    return buf;
  })();
  S.packWait.set(id, p);
  p.catch(() => S.packWait.delete(id));
  return p;
}
// Cropped pack is authoritative. A missing pack is temporary: preserve an
// image tile, but never display the entire standing figure as its portrait cover.
function portraitFallback(it){
  const c = String(it?.c || "");
  const s = String(it?.s || "").toLowerCase();
  return ["Human","Humanoid","Undead","Creature","Robot","Alien","Fashion","Group"].includes(c) ||
    ["umano","creatura","robot"].includes(s);
}
async function fallbackThumb(it){
  if (!it || it.mt === "video") return "";
  const id = it.p || it.o;
  if (!id) return "";
  const input = URL.createObjectURL(new Blob([await media(id)]));
  if (!portraitFallback(it)) return input;
  try {
    // Temporary no-model head-and-shoulders crop until the PC repackages its
    // authoritative face-aware 4:5 gallery cards. Does not touch the original.
    const original = new Image();
    await new Promise((resolve, reject) => {
      original.onload = resolve; original.onerror = reject; original.src = input;
    });
    const w = original.naturalWidth, h = original.naturalHeight;
    if (!(w > 0 && h > 0)) throw new Error("unreadable preview");
    const cv = document.createElement("canvas"); cv.width = 320; cv.height = 400;
    const ctx = cv.getContext("2d"); if (!ctx) throw new Error("canvas unavailable");
    // Upper-body crop for common centered studio/full-body compositions.
    const ch = Math.min(h, w / 0.8, Math.max(w * 0.68, h * 0.46));
    const cw = Math.min(w, ch * 0.8);
    const sy = Math.min(Math.max(0, h - ch), h * 0.04);
    const sx = Math.max(0, (w - cw) / 2);
    ctx.drawImage(original, sx, sy, cw, ch, 0, 0, 320, 400);
    const blob = await new Promise(resolve => cv.toBlob(resolve, "image/jpeg", 0.84));
    if (!blob) throw new Error("crop encoding unavailable");
    URL.revokeObjectURL(input);
    return URL.createObjectURL(blob);
  } catch (_) {
    // Failed decoding must not make the photo disappear again.
    return input;
  }
}
async function thumbUrl(it){
  if (!it?.k) return fallbackThumb(it);
  const [no, off, len] = it.k;
  try {
    const buf = await pack(no);
    if (!Number.isSafeInteger(off) || !Number.isSafeInteger(len) || off < 0 || len < 4 || off + len > buf.byteLength) {
      // A partial/corrupt pack should not be served repeatedly from the persistent cache.
      const id = S.index.packs[String(no)];
      if (id) {
        S.packs.delete(id);
        await (await caches.open("cv-packs")).delete(`https://cv.local/pack/${id}`);
      }
      throw new Error("invalid thumbnail pack");
    }
    return URL.createObjectURL(new Blob([buf.slice(off, off + len)], {type: "image/jpeg"}));
  } catch(err) {
    const preview = await fallbackThumb(it).catch(() => "");
    if (preview) return preview;
    throw err;
  }
}
async function setThumb(img, src){
  if (!src || !img.isConnected || !img.dataset.loaded) {
    if (src?.startsWith("blob:")) URL.revokeObjectURL(src);
    if (!src && img.isConnected) delete img.dataset.loaded;
    return;
  }
  img.onload = () => { img.classList.add("ok"); delete img.dataset.tries; };
  img.onerror = () => {
    const old = img.getAttribute("src") || "";
    img.removeAttribute("src"); img.classList.remove("ok");
    if (old.startsWith("blob:")) URL.revokeObjectURL(old);
    // A fetched pack can contain undecodable bytes; fall back to the source preview.
    if (!img.dataset.fallback && S.byId.get(img.dataset.id)?.k) {
      img.dataset.fallback = "1";
      fallbackThumb(S.byId.get(img.dataset.id)).then(url => {
        if (url) setThumb(img, url); else thumbFailed(img, new Error("preview not available"));
      }).catch(err => thumbFailed(img, err));
    } else thumbFailed(img, new Error("image decoding failed"));
  };
  img.src = src;
}
const io = new IntersectionObserver(entries => {
  for (const en of entries) {
    const img = en.target;
    if (en.isIntersecting) {
      if (img.dataset.loaded) continue;
      img.dataset.loaded = "1";
      thumbUrl((()=>{const item=S.byId.get(img.dataset.id);
        const sub=img.dataset.uSubject&&S.subjectById?.get(img.dataset.uSubject);
        return sub?.sk?{...item,k:sub.sk}:item;})()).then(url => setThumb(img, url))
        .catch(err => thumbFailed(img, err));
    } else if (img.dataset.loaded) {
      const old = img.getAttribute("src") || "";
      if (old.startsWith("blob:")) URL.revokeObjectURL(old);
      img.removeAttribute("src"); img.classList.remove("ok");
      delete img.dataset.loaded; delete img.dataset.fallback;
    }
  }
}, {rootMargin: "600px 0px"});

// Retry failed pack requests; refresh the index when the desktop replaced a bundle.
let lastIndexReload = 0;
function thumbFailed(img, err){
  delete img.dataset.loaded;
  const tries = +(img.dataset.tries || 0) + 1;
  img.dataset.tries = tries;
  const msg = String(err && err.message || "");
  if (/not found|404|non trovato/i.test(msg) && Date.now() - lastIndexReload > 30000) {
    lastIndexReload = Date.now();
    loadIndex(true).then(() => renderListOnly()).catch(() => {});
    return;
  }
  if (err instanceof AuthNeeded || tries > 4) return;
  setTimeout(() => { if (img.isConnected) { io.unobserve(img); io.observe(img); } }, 1500 * tries);
}

/* ============================================================= filtri e ricerca */
function filtered(base){
  const f = S.filters, q = norm(S.query).trim();
  const plus = [], minus = [];
  (q.match(/-?"[^"]+"|\S+/g) || []).forEach(tok => { const neg = tok.startsWith("-"); const t = tok.replace(/^-/, "").replace(/"/g, ""); if (t) (neg ? minus : plus).push(t); });
  let list = base.filter(it => {
    if (f.fav && !it.fav) return false;
    if (f.minr && (it.r || 0) < f.minr) return false;
    if (f.cat && it.c !== f.cat) return false;
    if (f.subj && it.s !== f.subj) return false;
    if (f.style && it.st !== f.style) return false;
    if (f.rating && it.cr !== f.rating) return false;
    if (f.pending && it.a) return false;
    if (plus.length || minus.length) { const h = haystack(it); if (!plus.every(t => h.includes(t)) || minus.some(t => h.includes(t))) return false; }
    return true;
  });
  const sort = f.sort || "new";
  if (sort === "old") list = list.slice().reverse();
  else if (sort === "rating") list = list.slice().sort((a, b) => (b.r || 0) - (a.r || 0) || (b.fav - a.fav));
  else if (sort === "title") list = list.slice().sort((a, b) => (a.t || a.f).localeCompare(b.t || b.f, "en"));
  return list;
}
function activeFilterChips(){
  const f = S.filters, out = [];
  if (f.fav) out.push(["fav", "♥ Favorites"]);
  if (f.minr) out.push(["minr", "★ " + f.minr + "+"]);
  if (f.cat) out.push(["cat", displayLabel(f.cat)]); if (f.subj) out.push(["subj", displayLabel(f.subj)]); if (f.style) out.push(["style", displayLabel(f.style)]);
  if (f.rating) out.push(["rating", f.rating]); if (f.pending) out.push(["pending", "To analyze"]);
  return out;
}

const VFIELDS = [["hair_color","Hair color"],["eye_color","Eye color"],
  ["hair_length","Hair length"],["hair_style","Hairstyle"],

function v7Match(subject, criteria, logic){
  const selected = Object.entries(criteria).filter(([key,value]) => key !== "logic" && value);
  if (!selected.length) return true;
  const tests = selected.map(([key,value]) => {
    const actual = norm(subject.attributes?.[key] || "").trim();
    const requested = norm(value).trim();
    if (!actual || actual === "unknown") return false;
    return ["hair_color","eye_color"].includes(key) ? actual === requested : actual.includes(requested);
  });
  return logic === "OR" ? tests.some(Boolean) : tests.every(Boolean);
}
function v7Matches(){

const ULTIMATE_TABS=[['search','Discover'],['lab','Statistics'],['collections','Collections'],
  ['world','World Atlas'],['quality','Archive Health'],['video','Video']];
function ultimateNaturalQuery(query){
  const q=norm(query || ''),out={};
  const c={black:['black','nero','nera','neri'],green:['green','verde','verdi'],
    blue:['blue','blu','azzurro'],brown:['brown','marrone','castano'],
    red:['red','rosso','rossa'],blonde:['blonde','blond','biondo','bionda'],
    white:['white','bianco','bianca'],gray:['gray','grey','grigio'],hazel:['hazel','nocciola']};
  for(const [field,terms] of [['hair_color',['hair','capelli','haare']],['eye_color',['eyes','eye','occhi','augen']]]){
    for(const [canonical,colors] of Object.entries(c)){
      if(terms.some(noun=>colors.some(col=>new RegExp('\\b'+col+'\\b(?:\\s+\\w+){0,2}\\s+'+noun+'\\b|\\b'+noun+'\\b(?:\\s+\\w+){0,2}\\s+'+col+'\\b','i').test(q)))){
        out[field]=canonical;break;
      }
    }
  }
  for(const [field,pattern,value] of [['setting',/\b(castle|castello)\b/,'castle'],
    ['time_of_day',/\b(night|notte|nighttime)\b/,'night'],
    ['art_style',/\b(gothic|gotico|gotica)\b/,'goth'],
    ['expression',/\b(smiling|sorridente)\b/,'smil']]) if(pattern.test(q)&&!out[field])out[field]=value;
  return out;
}
function ultimateSimilarity(reference, candidates){
  const weights={hair_color:4,eye_color:4,hair_length:2,hair_style:2,kind:3,body:2,
    age_range:1,clothing:2,expression:1,gaze:1,setting:1,art_style:2};
  return candidates.filter(s=>s.id!==reference.id).map(s=>{
    let possible=0,matching=0,shared=[];
    for(const [key,weight] of Object.entries(weights)){
      const a=norm(reference.attributes?.[key]||''),b=norm(s.attributes?.[key]||'');
      if(!a||!b)continue;
      possible+=weight;
      if(a===b){matching+=weight;shared.push(key)}
    }
    return {subject:s,score:possible?matching/possible:0,shared};
  }).filter(v=>v.score>0).sort((a,b)=>b.score-a.score).slice(0,90);
}

      <span style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(vizEnglish(value,field))}</span>
      <span class="viz-track"><span class="viz-fill" style="width:${Math.max(1,100*n/peak).toFixed(1)}%"></span></span>
      <b>${n}</b></button>`).join(''):'<p class="muted">No known values indexed yet.</p>';
}
function vizTimeline(rows){
  const history=(rows||[]).slice(-90).filter(r=>Number.isFinite(Number(r.images))&&Number.isFinite(Number(r.subjects)));
  if(!history.length)return '<p class="muted">Index snapshots will appear after a refresh.</p>';
  const max=Math.max(1,...history.map(r=>Math.max(Number(r.images),Number(r.subjects))));
  const pts=key=>history.map((r,i)=>`${(10+i*280/Math.max(1,history.length-1)).toFixed(2)},${(120-108*Number(r[key])/max).toFixed(2)}`).join(' ');
  return `<svg class="viz-timeline" viewBox="0 0 300 142" role="img" aria-label="Historical subject and image index counts">
    <path d="M10 12V120H292" stroke="var(--border2)" stroke-width="1" fill="none"/>
    <path d="M10 66H292" stroke="var(--border)" stroke-width="1" fill="none"/>
    <polyline points="${pts('images')}" stroke="var(--accent2)" stroke-width="2" fill="none"/>
    <polyline points="${pts('subjects')}" stroke="var(--info)" stroke-width="2" fill="none"/>
    <text x="11" y="138" fill="var(--text3)" font-size="9">${esc(String(history[0].date||'').slice(0,10))}</text>
    <text x="291" y="138" text-anchor="end" fill="var(--text3)" font-size="9">${esc(String(history.at(-1).date||'').slice(0,10))}</text></svg>
    <div class="viz-legend"><span style="color:var(--accent2)">● Images</span><span style="color:var(--info)">● Subjects</span></div>`;
}
function vizMatrix(subjects){
  const a=new Map(),b=new Map(),both=new Map();
  subjects.forEach(s=>{const x=vizKnown(s.attributes?.hair_color),y=vizKnown(s.attributes?.eye_color);
    if(!x||!y)return;a.set(x,(a.get(x)||0)+1);b.set(y,(b.get(y)||0)+1);
    const k=JSON.stringify([x,y]);both.set(k,(both.get(k)||0)+1);
  });
  const xs=[...a].sort((x,y)=>y[1]-x[1]).slice(0,5).map(x=>x[0]),ys=[...b].sort((x,y)=>y[1]-x[1]).slice(0,5).map(x=>x[0]);
  if(!xs.length||!ys.length)return '<p class="muted">No verified hair + eye color intersections yet.</p>';
  const peak=Math.max(1,...both.values());
  const head=`<span></span>${ys.map(y=>`<span class="viz-head">${esc(vizEnglish(y,"eye_color"))}</span>`).join('')}`;
  const rows=xs.map(x=>`<span class="viz-row-head">${esc(vizEnglish(x,"hair_color"))}</span>${ys.map(y=>{
    const n=both.get(JSON.stringify([x,y]))||0;
    return `<button type="button" ${n?`data-viz-hair="${esc(x)}" data-viz-eyes="${esc(y)}"`: 'disabled'}
      style="background:rgba(196,54,79,${(n?0.15+0.75*n/peak:0.07).toFixed(2)});color:var(--text)" title="${esc(vizEnglish(x,"hair_color"))} hair + ${esc(vizEnglish(y,"eye_color"))} eyes: ${n} subjects">${n}</button>`;
  }).join('')}`).join('');
  return `<div class="viz-matrix" style="grid-template-columns:74px repeat(${ys.length},minmax(40px,1fr))">${head}${rows}</div>`;
}

function coverCard(kind, obj, sub){
  const cover = S.byId.get(obj.cover) || S.index.images.find(it => (kind === "p" ? it.e : it.th)?.includes(obj.id));
  return `<button class="ent" data-open="${kind}:${esc(obj.id)}"><div class="cv"><img alt="" data-id="${esc(cover?.i || "")}"></div><b>${esc(obj.name)}</b><span>${esc(sub)}</span></button>`;
}
function bindCovers(){
  document.querySelectorAll(".ent img[data-id]").forEach(img => img.dataset.id && io.observe(img));
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { const [k, id] = b.dataset.open.split(":"); go(k === "p" ? `#/person/${encodeURIComponent(id)}` : `#/thing/${encodeURIComponent(id)}`); });
}
function renderPeople(group){
  const q = norm(S.query);

  const chips = Object.entries(GROUPS).map(([k, l]) => `<button class="chip ${k === group ? "on" : ""}" data-g="${k}">${l} · ${S.index.entities.filter(e => e.group === k).length}</button>`).join("");
  mountPage(`<div class="chips" style="padding-top:0">${chips}</div><div class="status"><span>${list.length} characters</span></div>
    <div class="list">${list.map(e => coverCard("p", e, `${e.n} images · ${e.type}`)).join("") || '<div class="empty">No characters.</div>'}</div>`, "Characters");

let detailIdx = -1, detailUrls = [];
function openDetail(id, list){
  S.detailList = list || S.list; detailIdx = S.detailList.findIndex(x => x.i === id);

}
window.addEventListener("popstate", () => { if ($("#detail")) closeDetail(true); });
function closeDetail(fromNav){
  const d = $("#detail"); if (!d) return;

  if (!d) { d = document.createElement("div"); d.id = "detail"; d.className = "sheet"; document.body.appendChild(d); document.body.style.overflow = "hidden"; }

  const ents = (it.e || []).map(id => S.entById.get(id)).filter(Boolean);
  const things = (it.th || []).map(id => S.thingById.get(id)).filter(Boolean);
  const assets = it.va || [];
  const star = n => `<button data-star="${n}" class="${(it.r || 0) >= n ? "on" : ""}">★</button>`;
  d.innerHTML = `<div class="bar"><button class="icon-btn" id="dback">${ico("back")}</button><div class="t">${esc(it.t || it.f)}</div><span class="muted">${detailIdx + 1}/${S.detailList.length}</span></div>
    <div class="viewer" id="viewer"><img id="dimg" alt=""><div class="spin" id="dspin">Loading preview…</div></div>
    <div class="info">
      <h3><span id="dtitle">${esc(it.t || it.f)}</span><button class="icon-btn" id="dedit">${ico("edit")}</button></h3>
      <div class="meta">${[it.mt === "video" ? `Video · ${Math.round(it.dur || 0)} s · ${it.vc || ""}` : "", it.w && it.h ? `${it.w}×${it.h}` : "", it.dt.replace("T", " "), [it.c, it.sc].filter(Boolean).join(" › "), it.st, it.cr].filter(Boolean).map(displayLabel).map(esc).join(" · ")}</div>
      <div class="row"><button class="fav ${it.fav ? "on" : ""}" id="dfav">${it.fav ? "♥" : "♡"}</button><div class="stars">${[1,2,3,4,5].map(star).join("")}</div></div>

  d.scrollTop = 0;

  viewer.addEventListener("touchend", e => {
    if (viewer.classList.contains("zoom") || e.changedTouches.length !== 1) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { detailIdx = Math.max(0, Math.min(S.detailList.length - 1, detailIdx + (dx < 0 ? 1 : -1))); showDetail(); }
  }, {passive: true});

  $("#ddl").onclick = async () => {
    if (it.mt === "video") {

      window.CVNative.saveDriveFile(it.o, it.f || (it.i + (it.x || ".jpg")));

    }
    try {
      const buf = await media(it.o);

      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
      btn.innerHTML = `${ico("download")} Downloaded`;
    } catch(e) { toast(e.message); btn.disabled = false; btn.innerHTML = `${ico("download")} Download original`; }

async function uploadFiles(files, inbox){
  const box = $("#uploads");
  for (const file of files) {
    const row = document.createElement("div"); row.className = "up";
    const url = URL.createObjectURL(file);
    row.innerHTML = `${file.type.startsWith("video/") ? `<video src="${url}" preload="none" muted style="width:60px;height:60px"></video>` : `<img src="${url}" alt="">`}<div class="n"><b>${esc(file.name)}</b><progress max="1" value="0"></progress><span class="muted">queued</span></div>`;
    box.prepend(row);
    const bar = row.querySelector("progress"), st = row.querySelector(".muted");
    try {
      st.textContent = "loading…";
      const res = await uploadLarge(file, inbox, p => bar.value = p);
      if (res && res.id) {
        S.localUploads.set(res.id, url);
        S.pending.unshift({id: res.id, name: file.name || "media", mimeType: file.type, createdTime: new Date().toISOString(), size: file.size});
      }
      bar.value = 1; st.textContent = "Uploaded: available under Awaiting desktop processing"; st.style.color = "var(--ok)";
    } catch(e) { st.textContent = e.message; st.style.color = "var(--danger)"; }
  }
}

/* ----------------------------------------------------------- desktop live status */
let liveLogBusy = false;
let lastRemoteLog = null;
async function updateLiveLog(force=false){
  if (liveLogBusy || S.view !== "live-log" || document.visibilityState === "hidden") return;
  liveLogBusy = true;
  try {
    const folder = await resolveFolders();
    const found = await children(folder.web, "cv_live_status_v1.json.gz", false, true);
    if (!found.length) { $("#live-state").textContent = "Waiting for the home PC to publish its first status. Check the desktop Live Log setting."; return; }
    const file = found[0];
    const rev = [file.id,file.version,file.modifiedTime,file.size].join(":");
    if (!force && lastRemoteLog?.rev === rev) {
      const age = Math.max(0, Math.round((Date.now() - lastRemoteLog.data.updated_at * 1000)/1000));
      $("#live-state").textContent = `Last update ${age} seconds ago${age > 120 ? " · PC may be offline or Drive delayed" : ""}`;
      return;
    }
    const data = await gunzipJson(await media(file.id));
    if (data.schema !== 1 || !Array.isArray(data.events)) throw new Error("Unsupported log format");
    lastRemoteLog = {rev, data};
    const age = Math.max(0,Math.round((Date.now() - data.updated_at * 1000)/1000));
    $("#live-state").textContent = `Last update ${age} seconds ago · ${data.events.length} recent events${age > 120 ? " · PC may be offline" : ""}`;
    const filter = $("#live-filter").value;
    const events = data.events.filter(x => !filter || x.channel === filter);
    $("#live-lines").textContent = events.map(x => `${x.at || ""} [${String(x.channel || "").toUpperCase()}] ${x.message || ""}`).join("\n") || "No recent events";
    $("#live-lines").scrollTop = $("#live-lines").scrollHeight;
  } catch(e) {
    if ($("#live-state")) $("#live-state").textContent = "Log unavailable: " + (e.message || "Drive connection error");
  } finally { liveLogBusy = false; }
}
function renderLiveLog(){
  mountPage(`<div class="section-title"><h2>Home PC · General Log</h2></div>
    <div class="panel"><div class="row"><select id="live-filter"><option value="">All</option><option value="agents">AI Agents</option><option value="drive">Drive</option><option value="import">Import</option><option value="codex">Codex</option><option value="local">Local</option></select><button class="btn" id="live-refresh">${ico("refresh")} Refresh</button></div>
      <p class="muted" id="live-state">Connecting to the home PC status feed…</p>
      <pre id="live-lines" style="white-space:pre-wrap;overflow:auto;max-height:62vh;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--bg2);color:var(--text2);font:11px/1.6 monospace"></pre></div>
    <p class="muted">Drive-synced, read-only, redacted status; not direct remote access. Updates may be delayed while offline.</p>`, "Live Log");
  $("#live-refresh").onclick = () => updateLiveLog(true);
  $("#live-filter").onchange = () => { if (lastRemoteLog) {
    $("#live-lines").textContent = lastRemoteLog.data.events.filter(x=>!$("#live-filter").value || x.channel === $("#live-filter").value).map(x=>`${x.at || ""} [${String(x.channel || "").toUpperCase()}] ${x.message || ""}`).join("\n") || "No recent events";
  }};
  void updateLiveLog();
}
setInterval(() => { if (S.view === "live-log") void updateLiveLog(); }, 15000);

/* ============================================================= avvio */
async function refresh(force){
  const btn = $("#refresh"); if (btn) btn.style.opacity = ".4";
  try { const changed = await loadIndex(force); await loadPending(); await flushOps(); render(); toast(changed ? "Archive updated" : "Already up to date"); }
  catch(e) { if (!(e instanceof AuthNeeded)) toast(e.message, 5000); }
  finally { if (btn) btn.style.opacity = ""; }
}
async function start(){
  render();
  if (!clientId() || !localStorage.getItem("cv_logged")) return;
  const cached = await loadCachedIndex();
  if (cached) render();
  try {
    if (!S.token) {
      if (!NATIVE) await new Promise(r => { const wait = () => window.google?.accounts?.oauth2 ? r() : setTimeout(wait, 100); wait(); });
      try { await login(""); } catch(e) { if (cached) { showReconnect(); return; } throw e; }
    }
    await loadIndex(false);
    await loadPending();
    await flushOps();
    render();
  } catch(e) {
    if (e instanceof AuthNeeded) return;
    const m = $("#msg"); if (m) m.textContent = e.message; else toast(e.message, 6000);
  }
}
// Tornando nell'app (o ogni 3 minuti mentre è aperta): se il PC ha pubblicato novità si aggiorna da sola.
let autoBusy = false;
async function autoRefresh(force=false){
  if (autoBusy || !S.index || (!NATIVE && (!S.token || Date.now() > S.tokenExp)) || $("#detail") || $("#fsheet") || $("#lv") || $("#story")) return;
  autoBusy = true;
  try {
    const previousGeneration = S.index.generated_ts;
    const previousCount = S.index.images.length;
    const previousPending = S.index.media_pending ?? 0;
    const fetched = await loadIndex(force);
    // A foreground resume forces a freshness check, not an unconditional
    // "Archive updated" notification or a disruptive re-render.
    const changed = fetched && (S.index.generated_ts !== previousGeneration ||
      S.index.images.length !== previousCount || (S.index.media_pending ?? 0) !== previousPending);
    const before = S.pending.length; await loadPending();
    if (changed || before !== S.pending.length) { render(); if (changed) toast("Archive updated"); }
  } catch(e) {
    // Keep the cached gallery available offline but show actionable diagnostics.
    // Do not spam a toast at every forty-second foreground poll.
    if (force) toast('Drive refresh unavailable: ' + (e?.message || 'try again'), 5000);
  } finally { autoBusy = false; }
}
// Native Android activity handles reliable foreground/background lifecycle and
// one-minute checks. The browser/PWA keeps its existing three-minute cadence.
window.__cvAutoSyncFromAndroid = force => { if (NATIVE) void autoRefresh(force === true); };
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") autoRefresh(); });
setInterval(autoRefresh, 180000);
restoreToken();
if (!NATIVE && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
window.addEventListener("load", start);
