name: Updater (Windows)
on:
  push:
    branches: [android-app]
    paths: [AGGIORNA_CHARACTER_VAULT.bat, install_update.py, .github/workflows/updater.yml]
  workflow_dispatch:
jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Installed 9.0.5 (with an old RC2.7.8 hotfix file and an 8.1 Genesis guide) and a 9.0.6 payload
        shell: pwsh
        run: |
          $old = "$env:RUNNER_TEMP\AI & Co (test)\CharacterVault"
          $new = "$env:RUNNER_TEMP\Download\CharacterVault_9.0.6"
          New-Item -ItemType Directory -Force "$old\character_vault", "$old\Data\db", "$old\Library", "$new\character_vault" | Out-Null
          Set-Content "$old\main.py" 'print("old")'
          Set-Content "$old\character_vault\__init__.py" '__version__ = "9.0.5"'
          Set-Content "$old\GENESIS_MOBILE_GUIDA_IT.md" '# old guide'
          Set-Content "$old\INSTALLA_RC278_SYNC_611.bat" '@echo old hotfix'
          Set-Content "$old\START_NOTEBOOK_8GB.bat" '@echo launcher'
          Set-Content "$old\Library\photo.jpg" 'USER MEDIA'
          Set-Content -Encoding ascii mkdb.py "import sqlite3, sys`nc = sqlite3.connect(sys.argv[1])`nc.execute('create table t(v)')`nc.execute('insert into t values (1)')`nc.commit()`n"
          python mkdb.py "$old\Data\db\character_vault.sqlite3"
          if (-not (Test-Path "$old\Data\db\character_vault.sqlite3")) { throw "test catalog not created" }
          Set-Content "$new\main.py" 'print("new")'
          Set-Content "$new\character_vault\__init__.py" '__version__ = "9.0.6"'
          Copy-Item install_update.py, AGGIORNA_CHARACTER_VAULT.bat $new
          python -c "import hashlib,json,pathlib,sys; r=pathlib.Path(sys.argv[1]); files=['main.py','character_vault/__init__.py']; json.dump({f: hashlib.sha256((r/f).read_bytes()).hexdigest() for f in files}, open(r/'SOURCE_MANIFEST_SHA256.json','w'))" "$new"
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\answers.txt", "$old`r`nAGGIORNA`r`n`r`n")
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\cancel.txt", "$old`r`nNO`r`n`r`n")
          "OLD=$old" | Out-File -Append $env:GITHUB_ENV
          "NEW=$new" | Out-File -Append $env:GITHUB_ENV
      - name: Run AGGIORNA_CHARACTER_VAULT.bat
        shell: cmd
        run: |
          cd /d "%NEW%"
          call AGGIORNA_CHARACTER_VAULT.bat < "%RUNNER_TEMP%\answers.txt" > "%GITHUB_WORKSPACE%\update.log" 2>&1
          type "%GITHUB_WORKSPACE%\update.log"
          set "CHK=%GITHUB_WORKSPACE%\checks.log"
          findstr /c:"FATTO" "%GITHUB_WORKSPACE%\update.log" && echo ok FATTO>>"%CHK%" || exit /b 1
          type "%OLD%\main.py" >>"%CHK%"
          findstr /c:"new" "%OLD%\main.py" && echo ok main.py replaced>>"%CHK%" || exit /b 1
          if exist "%OLD%\INSTALLA_RC278_SYNC_611.bat" exit /b 1
          echo ok old installer moved>>"%CHK%"
          if exist "%OLD%\GENESIS_MOBILE_GUIDA_IT.md" exit /b 1
          echo ok 8.1 Genesis guide moved>>"%CHK%"
          if not exist "%OLD%\START_NOTEBOOK_8GB.bat" exit /b 1
          echo ok launcher kept>>"%CHK%"
          findstr /c:"USER MEDIA" "%OLD%\Library\photo.jpg" && echo ok media kept>>"%CHK%" || exit /b 1
          dir /s /b "%OLD%\Data\backups\updates" >>"%CHK%"
          dir /s /b "%OLD%\Data\backups\updates\INSTALLA_RC278_SYNC_611.bat" && echo ok retired file in backup>>"%CHK%" || exit /b 1
          dir /s /b "%OLD%\Data\backups\updates\catalog_before_update.sqlite3" && echo ok catalog backup>>"%CHK%" || exit /b 1
          call AGGIORNA_CHARACTER_VAULT.bat < "%RUNNER_TEMP%\cancel.txt" > "%GITHUB_WORKSPACE%\cancel.log" 2>&1
          findstr /c:"Annullato" "%GITHUB_WORKSPACE%\cancel.log" && echo ok cancel without changes>>"%CHK%" || exit /b 1
      - name: Report
        if: always()
        shell: bash
        run: |
          for f in update.log cancel.log checks.log; do [ -f $f ] && echo "::notice title=$f::$(sed ':a;N;$!ba;s/\n/%0A/g' $f | cut -c1-3000)"; done; true
