name: Character Vault Android APK
on:
  push:
    branches: [android-app]
    paths-ignore: [INSTALLA_PLAYER_VIDEO.bat, tools/install_video_player.py, tools/qt_dll_doctor.py, .github/workflows/player-video.yml]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          cd android_app
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          keytool -genkeypair -keystore ci.jks -alias vault -storepass civault -keypass civault -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Character Vault CI" 2>/dev/null
          printf "storeFile=ci.jks\nstorePassword=civault\nkeyAlias=vault\nkeyPassword=civault\n" > keystore.properties
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease 2>&1 | tee build.log
      - name: Verify APK
        run: |
          APK=android_app/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/35.* | tail -1)
          badge=$("$BT/aapt" dump badging "$APK")
          echo "$badge" | grep -q "versionCode='905'" || { echo "::error::versionCode is not 905"; exit 1; }
          # 7.2: adaptive icon (with monochrome layer) and splash theme must be in the package
          "$BT/aapt" dump xmltree "$APK" res/mipmap-anydpi-v26/ic_launcher.xml >/dev/null 2>&1 || "$BT/aapt2" dump resources "$APK" | grep -q "mipmap/ic_launcher" || { echo "::error::adaptive icon missing"; exit 1; }
          "$BT/aapt2" dump resources "$APK" | grep -q "style/Theme.CharacterVault.Starting" || { echo "::error::splash theme missing"; exit 1; }
          "$BT/aapt2" dump resources "$APK" | grep -q "drawable/splash_icon_animated" || { echo "::error::animated splash icon missing"; exit 1; }
          # release resources are path-shortened by AGP 8 (res/xY.png): check that an icon is declared
          echo "$badge" | grep -qE "application-icon-160:'res/" || { echo "::error::launcher icon missing"; exit 1; }
          echo "$badge" | grep -E "^application: |application-icon-160" | head -2
          # 8.2.1: Genesis on the phone (native bridge class compiled into the APK)
          unzip -p "$APK" 'classes*.dex' | grep -aq "genesisPhoneGenerateDna" || { echo "::error::Genesis phone bridge missing"; exit 1; }
          unzip -p "$APK" 'classes*.dex' | grep -aq "genesisPhoneStudio" || { echo "::error::Studio phone bridge missing"; exit 1; }
          for f in index.html ui72.js ui72.css links73.js genesis82.js genesis_dna.js lab904.js lab_masters.json genesis_phone83.js studio90.js genesis_dna_v1.json icon-192.png icon-512.png manifest.webmanifest sw.js; do
            unzip -l "$APK" | grep -q "assets/$f" || { echo "::error::assets/$f missing"; exit 1; }
          done
          intents=$("$BT/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -cE "android.intent.action.SEND" || true)
          "$BT/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q '"text/plain"' || { echo "::error::text/plain share (video links) missing"; exit 1; }
          signer=$("$BT/apksigner" verify --print-certs "$APK" | grep -m1 "SHA-1" || true)
          size=$(du -h "$APK" | cut -f1)
          pkg=$(echo "$badge" | grep -E "^package:|^sdkVersion|^targetSdkVersion" | tr '\n' ' ')
          echo "::notice title=APK::size=$size | share intents=$intents | $pkg | signer $signer"
      - name: Report errors
        if: failure()
        run: |
          cd android_app
          grep -nE "^e: |^w: .*CropActivity|error:|What went wrong|Could not|Execution failed|Caused by|^> |Unresolved|Type mismatch" build.log | head -45 > errors.txt || true
          msg=$(sed ':a;N;$!ba;s/\n/%0A/g' errors.txt | cut -c1-3800)
          echo "::error title=Gradle::${msg}"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CharacterVault-apk-ci-signed
          path: android_app/app/build/outputs/apk/release/*.apk

  # BUILD_ANDROID_APK.bat on a clean Windows machine, from a path with "&", spaces and a long name,
  # with an EXISTING signing key (as on the user's PC): downloads Java, Android SDK and Gradle.
  bat-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run BUILD_ANDROID_APK.bat
        shell: cmd
        run: |
          set "DEST=%RUNNER_TEMP%\Users\Salvatore&Annalisa\Downloads\CharacterVault_9.0.6_sorgente\CharacterVault_9.0.6"
          robocopy . "%DEST%" /E /XD .git /NFL /NDL /NJH /NJS /NP >nul
          "%JAVA_HOME_17_X64%\bin\keytool.exe" -genkeypair -keystore "%DEST%\android_app\charactervault.jks" -alias vault -storepass "old&Pass!1" -keypass "old&Pass!1" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Character Vault CI" >nul 2>&1
          > "%DEST%\android_app\keystore.properties" (
            echo storeFile=charactervault.jks
            echo storePassword=old^&Pass!1
            echo keyAlias=vault
            echo keyPassword=old^&Pass!1
          )
          type "%DEST%\android_app\keystore.properties"
          cd /d "%DEST%"
          set JAVA_HOME=
          set ANDROID_HOME=
          set ANDROID_SDK_ROOT=
          set "CV_BUILD_DIR=%RUNNER_TEMP%\CVBuild"
          echo.| call BUILD_ANDROID_APK.bat > "%GITHUB_WORKSPACE%\bat.log" 2>&1
          type "%GITHUB_WORKSPACE%\bat.log"
          if not exist CharacterVault.apk exit /b 1
          findstr /c:"APK ready" "%GITHUB_WORKSPACE%\bat.log" || exit /b 1
          echo --- second run (tools already present)
          echo.| call BUILD_ANDROID_APK.bat > "%GITHUB_WORKSPACE%\bat2.log" 2>&1
          findstr /c:"APK ready" "%GITHUB_WORKSPACE%\bat2.log" || exit /b 1
      - name: Report
        if: always()
        shell: bash
        run: |
          for f in bat.log bat2.log; do [ -f $f ] || continue
            echo "::notice title=$f tail::$(tail -c 2500 $f | sed ':a;N;$!ba;s/\n/%0A/g')"
            msg=$(grep -nE "ERROR|error|FAILURE|What went wrong|Could not|e: |not found|cannot" $f | head -30 | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-3800)
            [ -n "$msg" ] && echo "::warning title=$f matches::${msg}"
          done
          true
