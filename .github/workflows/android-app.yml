name: Character Vault Android APK
on:
  push:
    branches: [android-app]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          cd android_app
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          keytool -genkeypair -keystore ci.jks -alias vault -storepass civault -keypass civault -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Character Vault CI" 2>/dev/null
          printf "storeFile=ci.jks\nstorePassword=civault\nkeyAlias=vault\nkeyPassword=civault\n" > keystore.properties
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log
      - name: Verifica APK
        run: |
          APK=android_app/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/35.* | tail -1)
          size=$(du -h "$APK" | cut -f1)
          assets=$(unzip -l "$APK" | grep -cE "assets/(index.html|icon-192.png|manifest.webmanifest)")
          badge=$("$BT/aapt" dump badging "$APK" | grep -E "^package:|^sdkVersion|^targetSdkVersion|uses-permission" | tr '\n' ' ')
          signer=$("$BT/apksigner" verify --print-certs "$APK" | grep -m1 "SHA-1" || true)
          intents=$("$BT/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -cE "android.intent.action.SEND" || true)
          echo "::notice title=APK::dim=$size | file interfaccia=$assets/3 | azioni condividi=$intents | $badge | firma $signer"
      - name: Report errors
        if: failure()
        run: |
          cd android_app
          grep -nE "^e: |error:|What went wrong|Could not|Execution failed|Caused by|^> |Unresolved|Type mismatch" build.log | head -45 > errors.txt || true
          msg=$(sed ':a;N;$!ba;s/\n/%0A/g' errors.txt | cut -c1-3800)
          echo "::error title=Gradle::${msg}"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CharacterVault-apk
          path: android_app/app/build/outputs/apk/release/*.apk

  # Prova reale del BAT per Windows su una macchina pulita: scarica Java, Android SDK e Gradle e crea l'APK.
  bat-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Esegui COMPILA_APK_ANDROID.bat
        shell: cmd
        run: |
          set JAVA_HOME=
          set ANDROID_HOME=
          set ANDROID_SDK_ROOT=
          echo.| call COMPILA_APK_ANDROID.bat > bat.log 2>&1
          type bat.log
          if not exist CharacterVault.apk exit /b 1
          type SHA1_ANDROID.txt
      - name: Report errors
        if: failure()
        shell: bash
        run: |
          msg=$(grep -nE "ERRORE|error|FAILURE|What went wrong|Could not|e: " bat.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-3800)
          echo "::error title=BAT::${msg:-nessun dettaglio}"
          tail -c 3000 bat.log | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::error title=BAT tail::/'
